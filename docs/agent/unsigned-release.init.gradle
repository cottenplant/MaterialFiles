/*
 * Disable Android release signing for agent-operated diagnostic builds.
 *
 * Invoke this file with Gradle's --init-script option from a clean worktree
 * after unsetting every signing-related environment name. The private marker
 * lets project configuration omit credential lookup and signing assignment.
 * Task graph assertions restrict the marker to Moby release diagnostics and
 * prevent execution if signing is present.
 */

gradle.beforeProject { project ->
    project.ext.set('agentUnsignedMobyRelease', true)
}

gradle.taskGraph.whenReady { taskGraph ->
    def applicationProjects = gradle.rootProject.allprojects.findAll { project ->
        project.pluginManager.hasPlugin('com.android.application')
    }
    def applicationTasks = taskGraph.allTasks.findAll { task ->
        task.project in applicationProjects
    }
    if (!applicationTasks.any { task -> task.name.contains('MobyRelease') }) {
        throw new GradleException('Unsigned release diagnostics require Moby release tasks')
    }
    if (applicationTasks.any { task ->
        task.name.contains('Upstream') || task.name.contains('MobyDebug')
    }) {
        throw new GradleException('Unsigned release diagnostics permit only Moby release tasks')
    }
    applicationProjects.each { project ->
        def android = project.extensions.getByName('android')
        if (android.buildTypes.getByName('release').signingConfig != null) {
            throw new GradleException('Release signing must remain disabled')
        }
    }
}
